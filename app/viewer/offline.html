<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline - TrackView</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#e5e5e5;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:20px}
.wrap{max-width:320px}
.icon{font-size:3rem;margin-bottom:16px}
h1{font-size:1.2rem;margin-bottom:8px}
p{font-size:.85rem;color:#999;margin-bottom:20px}
button{background:#7c3aed;color:#fff;border:none;padding:10px 24px;border-radius:8px;font-size:.9rem;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<div class="icon">📡</div>
<h1>You're Offline</h1>
<p>TrackView needs an internet connection to show live data.</p>
<button onclick="location.reload()">Retry</button>
</div>
</body>
</html>
