version: '3.8'

services:
  backend:
    build:
      context: ./soulsync-backend
      dockerfile: Dockerfile
    container_name: soulsync-backend-api
    restart: always
    expose:
      - "5000"
    ports:
      - "5000:5000"
    env_file:
      - ./soulsync-backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
    networks:
      - soulsync-network

  frontend:
    build:
      context: ./soulsync-admin
      dockerfile: Dockerfile
    container_name: soulsync-admin-frontend
    restart: always
    expose:
      - "3001"
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_API_URL=https://admin.soulsync.in
    networks:
      - soulsync-network
    depends_on:
      - backend

  nginx-proxy:
    image: nginx:1.25-alpine
    container_name: soulsync-nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/html:/var/www/html
    networks:
      - soulsync-network
    depends_on:
      - backend
      - frontend

networks:
  soulsync-network:
    driver: bridge
